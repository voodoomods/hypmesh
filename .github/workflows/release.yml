# Tag v0.0.1 → build the sdist and wheel, test the wheel, publish to PyPI with trusted publishing (no API token:
# the "pypi" environment and a pending publisher for this repository are configured on pypi.org).
name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: The tag matches the package version
        run: test "v$(python -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("src/hypmesh/__init__.py").read())[1])')" = "${GITHUB_REF_NAME}"
      - name: The wheel works on its own
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/python -c "import hypmesh; print(hypmesh.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
